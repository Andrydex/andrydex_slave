<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrydex Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <h1 class="text-3xl font-black text-emerald-500 tracking-tighter">ANDRYDEX SLAVE</h1>
            <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800">
                <button onclick="switchTab('uni')" id="btn-uni" class="px-6 py-2 rounded-lg font-bold transition-all bg-emerald-600">🎓 Bandi</button>
                <button onclick="switchTab('startup')" id="btn-startup" class="px-6 py-2 rounded-lg font-bold transition-all text-gray-500">🚀 Startup</button>
                <button onclick="switchTab('games')" id="btn-games" class="px-6 py-2 rounded-lg font-bold transition-all text-gray-500">🎮 Giochi</button>
            </div>
        </header>
        <div id="grid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>
    <script>
        let currentTab = 'uni';
        async function render() {
            const grid = document.getElementById('grid');
            let data;
            try {
                const res = await fetch('data/memoria.json?v=' + Date.now());
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                data = await res.json();
            } catch(e) {
                grid.innerHTML = `<p class="text-red-400 col-span-3 text-center mt-10">⚠️ Errore caricamento dati: ${e.message}</p>`;
                return;
            }
            grid.innerHTML = '';;
            
            const oggi = new Date();
            const filtered = Object.values(data).filter(i => {
                if (i.stato === 'ignorato') return false;
                
                // Filtro comune per le date dei bandi
                const checkScadenza = (scadenza) => {
                    if (scadenza && scadenza !== 'N.D.') {
                        const parti = scadenza.split('/');
                        if (parti.length === 3) {
                            const scad = new Date(parti[2], parti[1]-1, parti[0]);
                            if (scad < oggi) return false;
                        }
                    }
                    return true;
                };

                if (currentTab === 'uni') {
                    if (i.tipo !== 'universita') return false;
                    return checkScadenza(i.scadenza);
                } else if (currentTab === 'startup') {
                    if (i.tipo !== 'startup') return false;
                    return checkScadenza(i.scadenza);
                } else {
                    return (i.tipo === 'gioco' || i.tipo === 'dlc' || i.tipo === 'cheapshark' || !i.tipo) && i.stato !== 'preso';
                }
            }).reverse();

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl";
if(currentTab === 'uni') {
                    card.innerHTML = `
                        <div class="flex justify-between text-xs font-bold text-emerald-500 mb-2">
                            <span>VOTO: ${item.voto}/10</span><span>${item.data_rilevazione}</span>
                        </div>
                        <h3 class="font-bold mb-4 line-clamp-2">${item.titolo}</h3>
                        <div class="text-sm text-gray-400 space-y-2 mb-6">
                            <p>🏢 Ente: <span class="text-white">${item.ente || 'N.D.'}</span></p>
                            <p>📍 Luogo e Durata: <span class="text-white">${item.luogo || 'N.D.'} (${item.durata || 'N.D.'})</span></p>
                            <p>⏳ Scadenza: <span class="text-white">${item.scadenza}</span></p>
                            <div class="bg-gray-800 p-2 rounded mt-2">
                                <p class="text-xs text-gray-300 font-semibold mb-1">Cosa si fa:</p>
                                <p class="text-xs italic text-gray-400 line-clamp-2">${item.argomenti || 'N.D.'}</p>
                            </div>
                            <div class="bg-gray-800 p-2 rounded mt-2">
                                <p class="text-xs text-gray-300 font-semibold mb-1">Requisiti chiave:</p>
                                <p class="text-xs italic text-gray-400 line-clamp-2">${item.requisiti || 'N.D.'}</p>
                            </div>
                        </div>
                        <a href="${item.url}" target="_blank" class="block text-center bg-emerald-600 py-2 rounded-xl font-bold text-sm">Apri Bando</a>
                    `;
                }
                else if (currentTab === 'startup') {
                    card.innerHTML = `
                        <div class="flex justify-between text-xs font-bold text-purple-500 mb-2">
                            <span>VOTO: ${item.voto}/10</span><span>${item.data_rilevazione}</span>
                        </div>
                        <h3 class="font-bold mb-4 line-clamp-2">${item.titolo}</h3>
                        <div class="text-sm text-gray-400 space-y-2 mb-6">
                            <p>🏢 Ente: <span class="text-white">${item.ente || 'N.D.'}</span></p>
                            <p>💰 Fondo: <span class="text-white">${item.fondo || 'N.D.'}</span></p>
                            <p>⏳ Scadenza: <span class="text-white">${item.scadenza}</span></p>
                            <p class="text-xs italic text-gray-500 line-clamp-3">📝 ${item.requisiti || 'N.D.'}</p>
                        </div>
                        <a href="${item.url}" target="_blank" class="block text-center bg-purple-600 py-2 rounded-xl font-bold text-sm text-white">Vai al Bando</a>
                    `;
                } else {
                    let badge = item.tipo === 'dlc' ? '<span class="bg-purple-600 text-white px-2 py-0.5 rounded text-[10px] ml-2">DLC</span>' : '';
                    let scadenzaTesto = (item.scadenza && item.scadenza !== 'N.D.') ? `<p class="text-sm text-gray-400 mb-4">⏳ Scadenza: <span class="text-white">${item.scadenza.split(' ')[0]}</span></p>` : '<div class="mb-4"></div>';
                    
                    card.innerHTML = `
                        <div class="flex items-center mb-2">
                            <div class="text-xs font-bold text-blue-500 uppercase">${item.stato}</div>
                            ${badge}
                        </div>
                        <h3 class="font-bold mb-2 line-clamp-2">${item.titolo || 'Gioco'}</h3>
                        ${scadenzaTesto}
                        <a href="${item.url}" target="_blank" class="block text-center bg-blue-600 py-2 rounded-xl font-bold text-sm mt-auto">Store</a>
                    `;
                }
                grid.appendChild(card);
            });
        }
        function switchTab(t) {
            currentTab = t;
            document.getElementById('btn-uni').className = t === 'uni' ? "px-6 py-2 rounded-lg font-bold bg-emerald-600 text-white" : "px-6 py-2 rounded-lg font-bold text-gray-500";
            document.getElementById('btn-startup').className = t === 'startup' ? "px-6 py-2 rounded-lg font-bold bg-purple-600 text-white" : "px-6 py-2 rounded-lg font-bold text-gray-500";
            document.getElementById('btn-games').className = t === 'games' ? "px-6 py-2 rounded-lg font-bold bg-blue-600 text-white" : "px-6 py-2 rounded-lg font-bold text-gray-500";
            render();
        }
        render();
    </script>
</body>
</html>
