name: Automazione Bot Sconti

on:
  schedule:
    - cron: '0 8,14,20 * * *' # Gira alle 8, 14 e 20
  workflow_dispatch:

# 🛡️ PROTEZIONE ANTI-SOVRAPPOSIZIONE
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Scarica i file
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installa librerie
        run: pip install -r requirements.txt

      - name: 🚀 Fai partire lo script dei Giochi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: scripts
        run: python scripts/main.py

      - name: 💾 Salva la memoria su GitHub
        run: |
          git config --global user.name "Bot Memoria"
          git config --global user.email "bot@github.com"
          mkdir -p data
          touch data/memoria.json
          touch data/health.json
          git add data/
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git stash
          git pull origin main
          git stash pop
          git add data/
          git commit -m "Aggiornamento dati [skip ci]"
          git push
