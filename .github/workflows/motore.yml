name: Automazione Bot Sconti

# 1. QUANDO DEVE PARTIRE?
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

# Risolve l'avviso di Node.js forzando la versione 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 2. COSA DEVE FARE?
jobs:
  esegui-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Scarica i file della repository
      uses: actions/checkout@v4

    - name: 🐍 Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Installa gli attrezzi necessari (requests)
      run: pip install requests

    - name: 🚀 Fai partire il Bot!
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py
