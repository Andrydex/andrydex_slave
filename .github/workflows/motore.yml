name: Automazione Bot Sconti

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Scarica i file
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Installa librerie dal file requirements
        run: pip install -r requirements.txt

      - name: 🎮 Fai partire lo script dei Giochi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/giochi_gratis.py

      - name: 💾 Salva la memoria su GitHub
        run: |
          git config --global user.name "Bot Memoria"
          git config --global user.email "bot@github.com"
          mkdir -p data # Crea la cartella data se non esiste
          touch data/memoria.json
          git add data/memoria.json
          git commit -m "Aggiornamento memoria [skip ci]" || echo "Nessuna modifica"
          git pull --rebase origin main
          git push
