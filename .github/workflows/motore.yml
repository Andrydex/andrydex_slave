name: Automazione Bot Sconti

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions: # Diamo il permesso esplicito di scrivere nel repo
      contents: write

    steps:
    - name: 📥 Scarica i file
      uses: actions/checkout@v4

    - name: 🐍 Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Installa librerie
      run: pip install requests

    - name: 🚀 Fai partire il Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py

    - name: 💾 Salva la memoria su GitHub
      run: |
        git config --global user.name "Bot Memoria"
        git config --global user.email "bot@github.com"
        git add memoria.json
        git commit -m "Aggiornamento memoria giochi [skip ci]" || echo "Nessuna modifica da salvare"
        git push
